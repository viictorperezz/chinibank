<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101217">
  <meta name="description" content="ChiniBank · Casa de apuestas de prueba con datos ficticios. ATP San Roque: Chini vs Palo.">
  <title>ChiniBank · Apuestas deportivas</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Iconos -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3.5" y="9" width="17" height="11.5" rx="1.5"/><path d="M2.5 9h19M12 9v11.5M12 9S10.5 4 7.8 4.2C5.5 4.4 6 8 8.5 8.6M12 9s1.5-5 4.2-4.8c2.3.2 1.8 3.8-.7 4.4"/></symbol>
    <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-chev-d" viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 11L12 4l8.5 7M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></symbol>
    <symbol id="i-live" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M10 9.2v5.6l4.8-2.8z" fill="currentColor"/></symbol>
    <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M4 5h16v4a3 3 0 0 0 0 6v4H4v-4a3 3 0 0 0 0-6z"/><path d="M9 9h6M9 12h6M9 15h4"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M3.5 10h17l-1.6 9.2a2 2 0 0 1-2 1.8H7.1a2 2 0 0 1-2-1.8z"/><path d="M8 10l2.5-6M16 10l-2.5-6"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 4-6 8-6s7.2 2 8 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-fire" viewBox="0 0 24 24"><path d="M12 22c4 0 7-2.7 7-6.8 0-4.4-3.6-6.5-4.6-10.7-2.2 1.5-3 3.6-3 5.5-1.3-.8-2-2.2-2.1-3.6C7.2 8.4 5 11 5 15.2 5 19.3 8 22 12 22z" fill="#ff6a1a" stroke="none"/><path d="M12 22c-2 0-3.4-1.4-3.4-3.3 0-2.3 1.9-3.3 2.4-5.4 1.8 1 4.4 2.8 4.4 5.4 0 1.9-1.4 3.3-3.4 3.3z" fill="#ffc933" stroke="none"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2.5L4.5 13.5H11l-1 8 8.5-11H12z"/></symbol>
    <symbol id="i-stats" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2" fill="currentColor" stroke="none"/><rect x="10" y="9" width="4" height="12" rx="1" fill="currentColor" stroke="none"/><rect x="4" y="14" width="4" height="7" rx="1" fill="currentColor" stroke="none"/><rect x="16" y="12" width="4" height="9" rx="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
    <!-- Emote cigarro (a favor de Chini) -->
    <symbol id="e-cig" viewBox="0 0 64 64">
      <path d="M50 22c-4-4 3-7 0-11s3-6 0-9" fill="none" stroke="#dfe5ef" stroke-width="2.6" stroke-linecap="round" opacity=".85"/>
      <path d="M56 24c-2-3 2-5 0-8" fill="none" stroke="#dfe5ef" stroke-width="2" stroke-linecap="round" opacity=".55"/>
      <g transform="rotate(-25 32 34)">
        <rect x="4" y="29" width="17" height="10" rx="2.5" fill="#e8913a"/>
        <circle cx="9" cy="32" r="1" fill="#b8661c"/><circle cx="14" cy="35.5" r="1" fill="#b8661c"/><circle cx="18" cy="31.5" r="1" fill="#b8661c"/>
        <rect x="20" y="29" width="33" height="10" fill="#f7f4ee"/>
        <rect x="20" y="29" width="33" height="3" fill="#fff"/>
        <rect x="20" y="36.5" width="33" height="2.5" fill="#d9d4ca"/>
        <rect x="19" y="29" width="2" height="10" fill="#d9c37a"/>
        <rect x="52" y="29" width="6" height="10" fill="#6f625b"/>
        <rect x="56" y="29" width="4" height="10" rx="2" fill="#ff5a1f"/>
        <rect x="57.5" y="31" width="2" height="6" rx="1" fill="#ffd166"/>
      </g>
    </symbol>
    <!-- Emote palo / tronco (a favor de Palo) -->
    <symbol id="e-log" viewBox="0 0 64 64">
      <g transform="rotate(-18 32 34)">
        <path d="M27 24l-5-12" stroke="#7a4a1f" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M22 12c-7-2-10 2-10 6 5 1 10-1 10-6z" fill="#58b947"/>
        <path d="M23 13c4-4 9-3 10 0-4 2-8 2-10 0z" fill="#3f9a35"/>
        <rect x="6" y="23" width="46" height="22" rx="6" fill="#8b5a2b"/>
        <rect x="6" y="23" width="46" height="6" rx="3" fill="#a06a36"/>
        <path d="M12 33h20M17 39h24M30 28h14" stroke="#62391a" stroke-width="2.2" stroke-linecap="round"/>
        <ellipse cx="52" cy="34" rx="8" ry="11" fill="#e8bf83"/>
        <ellipse cx="52" cy="34" rx="5.2" ry="7.4" fill="none" stroke="#b8813f" stroke-width="1.6"/>
        <ellipse cx="52" cy="34" rx="2.2" ry="3.2" fill="#b8813f"/>
      </g>
    </symbol>
    <symbol id="i-ball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#d4ea37" stroke="none"/><path d="M3.8 5.2c3.6 3.3 3.6 10.3 0 13.6M20.2 5.2c-3.6 3.3-3.6 10.3 0 13.6" fill="none" stroke="#fff" stroke-width="1.7"/></symbol>
  </svg>

  <header class="topbar">
    <div class="topbar__inner">
      <button class="icon-btn menu-btn" data-act="open-menu" aria-label="Abrir menú">
        <svg class="ico"><use href="#i-menu"/></svg>
      </button>
      <a href="#/" class="logo" aria-label="ChiniBank, inicio">CHINIBANK</a>
      <nav class="mainnav" aria-label="Principal">
        <a href="#/" data-nav="home competition match calendar">Apuestas</a>
        <a href="#/directo" data-nav="live">En directo</a>
        <a href="#/promos" data-nav="promos">Promos</a>
      </nav>
      <div class="account">
        <span class="age" title="Solo mayores de 18">+18</span>
        <button class="auth-btn" data-act="login"><span class="lg">Conectarse</span><span class="sm">Entrar</span></button>
        <button class="auth-btn auth-btn--red" data-act="register"><span class="lg">Registrarse</span><span class="sm">Registro</span></button>
      </div>
    </div>
  </header>

  <div class="subnav">
    <div class="subnav__inner">
      <span class="subnav__title">Apuestas deportivas</span>
      <nav aria-label="Apuestas">
        <a href="#/" data-nav="home">Inicio</a>
        <a href="#/directo" data-nav="live">En directo</a>
        <a href="#/mis-apuestas" data-nav="bets">Mis apuestas</a>
      </nav>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Menú"></aside>
    <main class="view" id="view" tabindex="-1"></main>
    <aside class="slip" id="slip" aria-label="Cesta de apuestas"></aside>
  </div>

  <div class="scrim" id="scrim" data-act="close-overlays"></div>

  <button class="slipbar" id="slipbar" data-act="open-slip" aria-label="Abrir cesta"></button>

  <nav class="bottomnav" aria-label="Navegación">
    <a href="#/" data-nav="home"><svg class="ico"><use href="#i-home"/></svg><span>Inicio</span></a>
    <a href="#/competicion" data-nav="competition match"><svg class="ico ico--ball"><use href="#i-ball"/></svg><span>Tenis</span></a>
    <a href="#/directo" data-nav="live"><svg class="ico"><use href="#i-live"/></svg><span>Directo</span></a>
    <a href="#/mis-apuestas" data-nav="bets"><svg class="ico"><use href="#i-ticket"/></svg><span>Mis apuestas</span></a>
    <button data-act="open-slip"><svg class="ico"><use href="#i-bag"/></svg><span>Cesta</span><b class="badge" id="navBadge" hidden>0</b></button>
  </nav>

  <div class="modal" id="modal" hidden>
    <div class="modal__scrim" data-act="close-modal"></div>
    <div class="modal__box" id="modalBox" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
